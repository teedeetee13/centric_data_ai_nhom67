# Tự chạy kiểm tra lỗi tĩnh, kiểm thử và thử đóng gói Docker mỗi khi push hoặc mở Pull Request.
# Chạy thêm hằng tuần để phát hiện lỗ hổng mới trong thư viện dù không có thay đổi code.
name: Kiem thu EduSupportAI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 1 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduSupportAI
    env:
      EDUSUPPORT_LLM: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: EduSupportAI/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Kiem tra loi tinh (ruff)
        run: ruff check .
      - name: Kiem tra kho tri thuc
        run: python -m src.maintenance check-kb
      - name: Quet lo hong thu vien
        run: pip-audit -r requirements.txt
      - name: Chay kiem thu
        run: python -m unittest discover -s tests -t . -v

  docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduSupportAI
    steps:
      - uses: actions/checkout@v4
      - name: Dong goi image
        run: docker build -t edusupportai .
      - name: Khoi dong va kiem tra suc khoe
        run: |
          docker run -d --name app --read-only --tmpfs /tmp -v app-data:/data -p 8501:8501 \
            -e EDUSUPPORT_OFFICER_PASSWORD=ci-test -e EDUSUPPORT_LLM=off edusupportai
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
