# Tự mở Pull Request cập nhật phụ thuộc mỗi tháng, gộp thành ít PR để dễ xử lý
version: 2
updates:
  - package-ecosystem: pip
    directory: /EduSupportAI
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Mô hình đã lưu gắn với phiên bản này; nâng cấp phải huấn luyện lại (docs/TAI_LIEU.md mục 3)
      - dependency-name: scikit-learn
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /EduSupportAI
    schedule:
      interval: monthly
