# Chạy: docker compose up -d --build
# Kèm mô hình ngôn ngữ: docker compose --profile llm up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      EDUSUPPORT_ENV: production
      EDUSUPPORT_OFFICER_PASSWORD: ${EDUSUPPORT_OFFICER_PASSWORD:?Cần đặt mật khẩu cán bộ trong .env}
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "${APP_BIND:-127.0.0.1}:8501:8501"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  ollama:
    profiles: [llm]
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  ollama-pull:
    profiles: [llm]
    image: ollama/ollama:0.40.13
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${EDUSUPPORT_LLM_MODEL:-qwen2.5:3b}"]
    restart: "no"

volumes:
  app-data:
  ollama-models:
