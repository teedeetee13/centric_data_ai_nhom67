[project]
name = "edusupportai"
version = "0.2.0"
description = "Tiếp nhận, phân loại và xử lý ticket phản ánh sinh viên theo quy trình nghiệp vụ (Data-Centric AI)"
requires-python = ">=3.12,<3.13"

# Kiểm tra lỗi tĩnh: chỉ bật nhóm luật bắt lỗi thật (cú pháp, tên chưa định nghĩa, import thừa),
# không ép định dạng toàn bộ mã cũ. Chạy: ruff check .
[tool.ruff]
target-version = "py312"
line-length = 130
extend-exclude = [".venv", "data", "models", "images"]

[tool.ruff.lint]
select = ["E9", "F", "W6"]
# app/main.py phải thêm thư mục gốc vào sys.path trước khi import
per-file-ignores = { "app/main.py" = ["E402"] }
